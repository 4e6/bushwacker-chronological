# Deterministic playlist writer — makes the live YouTube playlist match
# bushwacker_playlist.txt. No LLM. Runs automatically after a merge to main that
# changes the playlist file, and can also be run manually (dry-run by default).
name: playlist-apply

on:
  push:
    branches: [main]
    paths: ['bushwacker_playlist.txt']   # only when the curated list changes
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (read-only, default) or apply (writes to the playlist)"
        type: choice
        options: [dry-run, apply]
        default: dry-run

# Least privilege: this job never writes the repo.
permissions:
  contents: read

concurrency:
  group: playlist-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Gated by the youtube-prod environment (deployment branch restricted to main),
    # so the write token is only usable from main.
    environment: youtube-prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Sync playlist
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # push (post-merge) → real write; manual dispatch → per the mode input
          APPLY: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && '1' || '' }}
        run: python3 scripts/yt_playlist_sync.py
