# Nightly, fully hands-off: detect new uploads → classify with Claude → open a PR
# → auto-merge it → apply to the live YouTube playlist. The merged PRs are the
# change log. The classify step (LLM) never receives the YouTube token.
#
# Note: a GITHUB_TOKEN merge does NOT trigger other workflows, so the apply runs
# inline here (as its own youtube-prod-gated job) rather than via playlist-apply.
name: nightly-sync

on:
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write            # push the sync branch + merge
  pull-requests: write       # open/merge the PR

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      apply_needed: ${{ steps.changed.outputs.apply_needed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Deterministic: RSS diff + Data API durations. Holds YT_* but runs no LLM.
      - name: Detect new uploads
        id: detect
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OUT_JSON: ${{ github.workspace }}/new_videos.json
        run: python3 scripts/detect_new.py

      - name: Install Claude Code
        if: steps.detect.outputs.has_new == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Claude only edits the text files. Its env has ONLY its own token.
      - name: Classify with Claude
        if: steps.detect.outputs.has_new == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="$(cat scripts/classify_prompt.md)

          Run date (UTC): $(date -u +%F). New uploads are in new_videos.json."
          claude -p "$PROMPT" \
            --allowedTools "Read,Edit,Grep" \
            --permission-mode acceptEdits

      # Subtitles are driven by "is any playlist video missing one?", NOT by has_new —
      # so a fetch that failed before (bot-block, or auto-captions not ready yet on a
      # fresh upload) is retried on later nightly runs until it lands, even on a night
      # with no new video. Cheap DRY check first (pure Python, no network) so we only
      # pull the yt-dlp binary when there's actually something to fetch. Both steps are
      # continue-on-error, so the subtitle subsystem can never block the playlist sync.
      - name: Check for missing subtitles
        id: subs
        continue-on-error: true
        env:
          DRY_RUN: "1"
        run: python3 scripts/fetch_subtitles.py     # writes missing=<N> to $GITHUB_OUTPUT

      - name: Fetch subtitles (best-effort)
        if: steps.subs.outputs.missing != '0'
        continue-on-error: true
        run: |
          # Standalone yt-dlp binary (self-contained, always on PATH) — avoids the
          # PEP-668 "externally-managed" pip breakage on the runner's system Python.
          # Unpinned "latest" on purpose: yt-dlp must track YouTube's frequent changes.
          # YouTube has no Data-API path to a third party's captions, so this must use
          # yt-dlp, which CAN be bot-blocked from datacenter IPs → a block just leaves the
          # gap for the next night. Whisper (videos with no captions) stays local.
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
          python3 scripts/fetch_subtitles.py

      # apply_needed → the curated playlist changed (a period episode was added) → the
      # youtube-prod apply job runs (Shorts/META touch excluded.txt only → no write).
      # pr_needed → ANYTHING tracked changed: classify's text edits and/or a freshly
      # fetched subtitle (the retry case changes only subtitles/). Always runs, so a
      # subtitles-only backfill on a no-new-video night still opens its own PR.
      - name: Decide what changed
        id: changed
        run: |
          if git status --porcelain bushwacker_playlist.txt | grep -q .; then
            echo "apply_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply_needed=false" >> "$GITHUB_OUTPUT"
          fi
          if git status --porcelain bushwacker_playlist.txt bushwacker_excluded.txt | grep -q .; then
            echo "pr_needed=true" >> "$GITHUB_OUTPUT"
            echo "title=sync: classify new channel videos" >> "$GITHUB_OUTPUT"
          elif git status --porcelain subtitles/ | grep -q .; then
            echo "pr_needed=true" >> "$GITHUB_OUTPUT"
            echo "title=sync: backfill missing subtitles" >> "$GITHUB_OUTPUT"
          else
            echo "pr_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR
        id: cpr
        if: steps.changed.outputs.pr_needed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          branch: sync/auto
          base: main
          title: ${{ steps.changed.outputs.title }}
          commit-message: ${{ steps.changed.outputs.title }}
          body: |
            Automated @Bushwackerhistory sync — new-video classification
            (duration-first) and/or backfilled Russian subtitles. **Auto-merged** —
            kept as the change log; the diff shows exactly what changed.
          add-paths: |
            bushwacker_playlist.txt
            bushwacker_excluded.txt
            subtitles/
          delete-branch: true

      # Auto-merge via squash — the repo's ONLY enabled merge method (allow_merge_commit
      # is off, so --merge fails with "Merge commits are not allowed on this repository").
      # Branch protection is off, so GITHUB_TOKEN can merge. Retry ONLY the transient
      # "mergeability still computing" state; fail fast & loud on any permanent error.
      - name: Auto-merge the sync PR
        if: steps.changed.outputs.pr_needed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          for i in 1 2 3 4 5 6; do
            if out="$(gh pr merge "$PR" --squash --delete-branch 2>&1)"; then
              echo "merged PR #$PR"; exit 0
            fi
            # Only "mergeability still being computed" is transient → retry. Anything else
            # (merge method disabled, required review/checks) is permanent → fail now so the
            # real error surfaces instead of being masked as "not mergeable yet".
            if printf '%s\n' "$out" | grep -qiE 'not mergeable|unknown merge state|base branch was modified|try again'; then
              echo "PR #$PR mergeability still computing (attempt $i) — waiting 10s…"; sleep 10
            else
              printf '%s\n' "$out"; echo "::error::PR #$PR merge failed (not retryable)"; exit 1
            fi
          done
          echo "::error::could not auto-merge PR #$PR after $i attempts"; exit 1

  # Separate job so the write happens inside the youtube-prod environment
  # (deployment branch = main). Runs only when a period episode was added.
  apply:
    needs: sync
    if: needs.sync.outputs.apply_needed == 'true'
    runs-on: ubuntu-latest
    environment: youtube-prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main           # post-merge HEAD, so it sees the new episode
      - name: Apply to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          APPLY: "1"
        run: python3 scripts/yt_playlist_sync.py
